<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f9f7ff"/>
      <stop offset="100%" style="stop-color:#ede8ff"/>
    </linearGradient>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8c52ff"/>
      <stop offset="100%" style="stop-color:#5ce1e6"/>
    </linearGradient>
    <linearGradient id="gradText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8c52ff"/>
      <stop offset="100%" style="stop-color:#0cc0df"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Top accent bar -->
  <rect width="1200" height="4" fill="url(#grad)"/>
  <!-- Card -->
  <rect x="80" y="80" width="1040" height="470" rx="16" fill="white" opacity="0.9"/>
  <!-- Logo text -->
  <text x="120" y="180" font-family="Georgia, serif" font-size="48" font-weight="700" fill="url(#gradText)" letter-spacing="-1">Laatuhieronta.fi</text>
  <!-- Divider -->
  <rect x="120" y="210" width="80" height="3" fill="url(#grad)" rx="2"/>
  <!-- Headline -->
  <text x="120" y="290" font-family="Georgia, serif" font-size="38" font-weight="700" fill="#19141f" letter-spacing="-0.5">Omavalvontajärjestelmä</text>
  <text x="120" y="340" font-family="Georgia, serif" font-size="38" font-weight="700" fill="#19141f" letter-spacing="-0.5">sote-alan ammattilaisille</text>
  <!-- Sub -->
  <text x="120" y="400" font-family="Arial, sans-serif" font-size="24" fill="#655b78">Lakisääteinen omavalvontasuunnitelma tunnissa.</text>
  <text x="120" y="434" font-family="Arial, sans-serif" font-size="24" fill="#655b78">Ohjattu lomake · Julkinen linkki · 19,90 €/kk · ALV 0 %</text>
  <!-- Badge -->
  <rect x="120" y="470" width="280" height="44" rx="8" fill="url(#grad)"/>
  <text x="260" y="498" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">Aloita 14 päivän kokeilu</text>
</svg>
